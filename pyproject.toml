[project]
name = "cap-table-reconciler"
version = "0.1.0"
description = "Cleans messy cap tables and outputs a structured liquidation waterfall with breakpoints. Demo tool for Qapita interview."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
