[project]
name = "esop-atlas"
version = "0.1.0"
description = "SEA-India ESOP Cross-Border Compliance Atlas. Workflow tool for Qapita BD/FO: input parent jurisdiction + employee jurisdiction + event + status, output statutorily-cited compliance verdict. Demo build for Jax Liu interview, May 2026."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
